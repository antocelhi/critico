<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pregunta de Criterio - Ramo U</title>
  
  <style>
    :root {
      --bg-cream: #f7e9db;
      --green-dark: #3a5635;
      --orange-accent: #d57b0e;
      --card-bg: rgba(247, 233, 219, 0.95);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      width: 100vw;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow: hidden;
      position: relative;
      background: linear-gradient(-45deg, var(--bg-cream), #ebd8c5, var(--green-dark), var(--orange-accent));
      background-size: 400% 400%;
      animation: auraGradient 10s ease infinite;
    }

    @keyframes auraGradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 2px solid rgba(255, 255, 255, 0.6);
      border-radius: 28px;
      padding: 36px 24px;
      width: 100%;
      max-width: 520px;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(58, 86, 53, 0.35);
      position: relative;
      min-height: 380px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .question {
      color: var(--green-dark);
      font-size: 1.35rem;
      line-height: 1.5;
      font-weight: 700;
      margin-bottom: 24px;
    }

    .btn-area {
      position: relative;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px; /* Space between buttons to prevent overlap */
      padding: 10px 0;
      min-height: 160px;
    }

    .btn {
      width: 100%;
      max-width: 380px;
      padding: 16px 24px;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      text-align: center;
      line-height: 1.3;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
    }

    /* Green Button (SI) */
    .btn-yes {
      background-color: var(--green-dark);
      color: var(--bg-cream);
      transition: transform 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
      z-index: 2;
    }

    .btn-yes:hover {
      transform: scale(1.03);
      background-color: #2c4228;
      box-shadow: 0 8px 22px rgba(58, 86, 53, 0.35);
    }

    .btn-yes:active {
      transform: scale(0.98);
    }

    /* Orange Button (NO - Escaping Button) */
    .btn-no {
      background-color: var(--orange-accent);
      color: #ffffff;
      /* Kept in standard flow initially so it never overlaps with btn-yes */
      position: relative;
      transition: left 0.15s cubic-bezier(0.2, 0.8, 0.2, 1), top 0.15s cubic-bezier(0.2, 0.8, 0.2, 1);
      z-index: 5;
    }

    .btn-no:hover {
      background-color: #be6b0a;
    }

    .final-message {
      display: none;
      color: var(--green-dark);
      font-size: 1.8rem;
      font-weight: 800;
      line-height: 1.4;
      margin: auto 0;
      animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes popIn {
      0% {
        opacity: 0;
        transform: scale(0.7);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }
  </style>
</head>
<body>

  <main class="card" id="mainCard">
    <h1 class="question" id="questionText">
      Si tuvieras que diseñar algo para alguien que no conoces ¿Confiarías en tu criterio?
    </h1>

    <div class="btn-area" id="btnArea">
      <button class="btn btn-yes" id="btnYes">
        Me confío en mi opinión y la de otros
      </button>
      <button class="btn btn-no" id="btnNo">
        Debo conocer a la otra persona
      </button>
    </div>

    <div class="final-message" id="finalMessage">
      ¡Sabía que presionarías la correcta!
    </div>
  </main>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const card = document.getElementById('mainCard');
      const questionText = document.getElementById('questionText');
      const btnArea = document.getElementById('btnArea');
      const btnYes = document.getElementById('btnYes');
      const btnNo = document.getElementById('btnNo');
      const finalMessage = document.getElementById('finalMessage');

      function escapeButton() {
        const cardRect = card.getBoundingClientRect();
        const btnRect = btnNo.getBoundingClientRect();

        const padding = 16;
        
        // Calculate safe boundaries relative to card container
        const minX = padding;
        const maxX = cardRect.width - btnRect.width - padding;
        
        const minY = padding;
        const maxY = cardRect.height - btnRect.height - padding;

        // Generate random target position inside card bounds
        const randomX = Math.floor(Math.random() * (maxX - minX + 1)) + minX;
        const randomY = Math.floor(Math.random() * (maxY - minY + 1)) + minY;

        // Switch to absolute positioning only when escaping starts
        btnNo.style.position = 'absolute';
        btnNo.style.left = `${randomX}px`;
        btnNo.style.top = `${randomY}px`;
      }

      // Mouse triggers for desktop
      btnNo.addEventListener('mouseenter', escapeButton);
      btnNo.addEventListener('mousemove', escapeButton);

      // Touch triggers for smartphones
      btnNo.addEventListener('touchstart', (e) => {
        e.preventDefault();
        escapeButton();
      }, { passive: false });

      // Click trigger for success state
      btnYes.addEventListener('click', () => {
        questionText.style.display = 'none';
        btnArea.style.display = 'none';
        finalMessage.style.display = 'block';
      });
    });
  </script>
</body>
</html>
