<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pregunta de Criterio</title>
  <style>
    :root {
      --bg-light: #f7e9db;
      --green-dark: #3a5635;
      --orange-accent: #d57b0e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow: hidden;
      background: linear-gradient(-45deg, var(--bg-light), #ebd8c5, var(--green-dark), var(--orange-accent));
      background-size: 400% 400%;
      animation: auraGradient 12s ease infinite;
    }

    @keyframes auraGradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .card {
      background: rgba(247, 233, 219, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 24px;
      padding: 40px 24px;
      width: 100%;
      max-width: 550px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(58, 86, 53, 0.25);
      position: relative;
      min-height: 360px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    h1 {
      color: var(--green-dark);
      font-size: 1.35rem;
      line-height: 1.5;
      margin-bottom: 30px;
      font-weight: 700;
    }

    .btn-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
      align-items: center;
      justify-content: center;
      position: relative;
      min-height: 140px;
    }

    .btn {
      width: 100%;
      max-width: 380px;
      padding: 16px 20px;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      outline: none;
      text-align: center;
      line-height: 1.3;
      transition: transform 0.2s ease, background-color 0.2s ease;
    }

    /* Botón Naranjo (Sí) - Muestra el mensaje de confirmación */
    .btn-yes {
      background-color: var(--orange-accent);
      color: #ffffff;
      box-shadow: 0 4px 15px rgba(213, 123, 14, 0.3);
    }

    .btn-yes:hover {
      transform: scale(1.02);
      background-color: #b8670b;
    }

    /* Botón Verde (No) - Se escapa */
    .btn-no {
      background-color: var(--green-dark);
      color: var(--bg-light);
      box-shadow: 0 4px 15px rgba(58, 86, 53, 0.25);
      position: relative;
      transition: left 0.15s ease, top 0.15s ease;
    }

    .final-message {
      display: none;
      color: var(--green-dark);
      font-size: 1.6rem;
      font-weight: 700;
      line-height: 1.4;
      animation: fadeIn 0.4s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

  <div class="card" id="card">
    <h1 id="pregunta">¿Puede la popularidad ser una medida de calidad en diseño?</h1>
    <div class="btn-container" id="btnContainer">
      <button class="btn btn-yes" id="btnYes">Sí</button>
      <button class="btn btn-no" id="btnNo">No</button>
    </div>
    <div class="final-message" id="finalMessage">¡Sabía que presionarías la correcta!</div>
  </div>

  <script>
    const elPregunta = document.getElementById('pregunta');
    const elBtnYes = document.getElementById('btnYes');
    const elBtnNo = document.getElementById('btnNo');
    const elFinalMessage = document.getElementById('finalMessage');
    const btnContainer = document.getElementById('btnContainer');
    const card = document.getElementById('card');

    function moverBotonNo() {
      elBtnNo.style.position = 'absolute';

      const cardRect = card.getBoundingClientRect();
      const btnRect = elBtnNo.getBoundingClientRect();

      const padding = 20;
      const maxX = cardRect.width - btnRect.width - padding;
      const maxY = cardRect.height - btnRect.height - padding;

      const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
      const randomY = Math.max(padding, Math.floor(Math.random() * maxY));

      elBtnNo.style.left = `${randomX}px`;
      elBtnNo.style.top = `${randomY}px`;
    }

    elBtnNo.addEventListener('mouseenter', moverBotonNo);
    elBtnNo.addEventListener('touchstart', function(e) {
      e.preventDefault();
      moverBotonNo();
    });

    elBtnYes.addEventListener('click', () => {
      elPregunta.style.display = 'none';
      btnContainer.style.display = 'none';
      elFinalMessage.style.display = 'block';
    });
  </script>
</body>
</html>
